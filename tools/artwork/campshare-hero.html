<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 露营分享 App 824x474</title>
  <link rel="stylesheet" href="campshare.css" />
</head>
<body>
  <div class="cs-hero">
    <span class="cs-mint" aria-hidden="true"></span>
    <span class="cs-blob cs-blob--jade" aria-hidden="true"></span>
    <span class="cs-blob cs-blob--coral" aria-hidden="true"></span>
    <span class="cs-blob cs-blob--gold" aria-hidden="true"></span>
    <span class="cs-contour" aria-hidden="true"></span>

    <div class="cs-hero__copy">
      <span class="cs-hero__eyebrow">CAMP SHARE · CASE STUDY</span>
      <p class="cs-hero__title">露营分享</p>
      <p class="cs-hero__en">CAMP SHARE APP</p>
      <p class="cs-hero__lead">
        去过的路线、拍下的照片、遇到的人：<br />
        把一次徒步拆成「地点 → 笔记 → 留言」，装进一个薄荷绿的户外社区。
      </p>
      <div class="cs-hero__chips">
        <span class="cs-hero__chip">热门地点</span>
        <span class="cs-hero__chip">足迹笔记</span>
        <span class="cs-hero__chip">金币 · 会员</span>
      </div>
    </div>

    <p class="cs-hero__note"><i aria-hidden="true"></i>5 COIN · 196 LIKES · PERU INCA TRAIL</p>

    <!-- 动态详情（后）与首页（前）：设计稿原图，不重绘 -->
    <figure class="cs-shot" style="width:176px;height:381px;right:238px;top:46px;transform:rotate(5deg);opacity:.95">
      <img src="../../assets/images/campshare-post.png" alt="" />
    </figure>
    <figure class="cs-shot" style="width:208px;height:450px;right:40px;top:12px;transform:rotate(-4deg)">
      <img src="../../assets/images/campshare-home.png" alt="" />
    </figure>
  </div>
</body>
</html>
