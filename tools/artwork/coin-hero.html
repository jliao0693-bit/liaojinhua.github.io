<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 加密钱包 App 824x474</title>
  <link rel="stylesheet" href="coinwallet.css" />
</head>
<body>
  <div class="hero">
    <span class="hero__sky" aria-hidden="true"></span>
    <span class="hero__grid" aria-hidden="true"></span>

    <div class="hero__copy">
      <span class="hero__eyebrow">CRYPTO WALLET · CASE STUDY</span>
      <p class="hero__title"><span class="hero__rule" aria-hidden="true"></span>加密钱包 App</p>
      <p class="hero__en">MARKET · PORTFOLIO · TRADE</p>
      <p class="hero__lead">
        行情页只回答「今天涨没涨」，<br />
        持仓页只回答「我一共赚了多少」，<br />
        详情页把图表与买卖放在同一屏。
      </p>
      <div class="hero__chips">
        <span class="hero__chip">五屏界面</span>
        <span class="hero__chip">薄荷绿 + 雾白</span>
        <span class="hero__chip">印尼语界面</span>
      </div>
    </div>

    <p class="hero__note"><i aria-hidden="true"></i>BTC +15.3% · <b>ETH -2.1%</b> · 24H $10.24B</p>

    <!-- 行情（后）、首页（中）、币种详情（前）：五屏的渲染图，不重绘 -->
    <figure class="shot" style="left:404px;top:104px;width:138px;height:298px;transform:rotate(7deg)">
      <img src="../../assets/images/coin-market.png" alt="" />
    </figure>
    <figure class="shot" style="left:512px;top:68px;width:152px;height:329px;transform:rotate(-2deg)">
      <img src="../../assets/images/coin-home.png" alt="" />
    </figure>
    <figure class="shot" style="left:632px;top:26px;width:176px;height:381px;transform:rotate(3deg)">
      <img src="../../assets/images/coin-detail.png" alt="" />
    </figure>
  </div>
</body>
</html>
