<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 加密交易官网 824x474</title>
  <link rel="stylesheet" href="cryptosite.css" />
</head>
<body>
  <div class="cs-hero">
    <span class="cs-sky" aria-hidden="true"></span>
    <span class="cs-grid" aria-hidden="true"></span>

    <div class="cs-hero__copy">
      <span class="cs-hero__eyebrow">CRAPPO · CASE STUDY</span>
      <p class="cs-hero__title">加密交易官网</p>
      <p class="cs-hero__en">LANDING PAGE · PC 1440</p>
      <p class="cs-hero__lead">
        一句价值主张、一条信任背书、一个动作——<br />
        首屏 3 秒讲完，剩下五段只做证明。
      </p>
      <div class="cs-hero__chips">
        <span class="cs-hero__chip">六段滚动</span>
        <span class="cs-hero__chip">深紫 + 电光蓝</span>
        <span class="cs-hero__chip">$30B / 10M+ / 195</span>
      </div>

      <!-- 六段的顺序，一行走完：访客在首屏就能知道往下会看到什么 -->
      <p class="cs-hero__map">
        <span>首屏</span><i>›</i><span>三段特性</span><i>›</i><span>算力计算器</span>
        <i>›</i><span>币价</span><i>›</i><span>数字背书</span><i>›</i><span>订阅</span>
      </p>
    </div>

    <p class="cs-hero__note">
      <i aria-hidden="true"></i>BTC +125% · <b>ETH -0.9%</b> · LTC +8.2%
    </p>

    <!-- 首屏整段：设计稿原图装在浏览器窗口里，不重绘 -->
    <div class="cs-frame" style="left:412px;top:66px;width:356px;height:250px">
      <div class="cs-frame__bar" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="cs-frame__view"><img src="../../assets/images/crypto-header.png" alt="" style="object-position:50% 34%" /></div>
    </div>

    <div class="cs-hero__stats">
      <p class="cs-hero__stat"><b>$30B</b><span>交易额</span></p>
      <p class="cs-hero__stat"><b>10M+</b><span>钱包</span></p>
      <p class="cs-hero__stat"><b>195</b><span>国家</span></p>
    </div>
  </div>
</body>
</html>
