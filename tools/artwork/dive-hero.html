<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 潜水分享 App 824x474</title>
  <link rel="stylesheet" href="diveshare.css" />
</head>
<body>
  <div class="ds-hero">
    <span class="ds-water" aria-hidden="true"></span>
    <span class="ds-ray" style="left:470px;width:96px;transform:rotate(15deg)" aria-hidden="true"></span>
    <span class="ds-ray" style="left:594px;width:58px;transform:rotate(21deg);opacity:.78" aria-hidden="true"></span>
    <span class="ds-ray" style="left:392px;width:40px;transform:rotate(9deg);opacity:.5" aria-hidden="true"></span>
    <span class="ds-caustic" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:700px;top:352px;width:9px;height:9px" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:726px;top:392px;width:5px;height:5px" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:676px;top:414px;width:4px;height:4px" aria-hidden="true"></span>

    <div class="ds-hero__copy">
      <span class="ds-hero__eyebrow">DIVE SHARE · CASE STUDY</span>
      <p class="ds-hero__title">潜水分享</p>
      <p class="ds-hero__en">DIVE SHARE APP</p>
      <p class="ds-hero__lead">
        潜水员缺的从来不是装备，是同伴：<br />
        一个把「去哪潜」和「跟谁一起潜」放在一起的社区。
      </p>
      <div class="ds-hero__chips">
        <span class="ds-hero__chip">热门潜点</span>
        <span class="ds-hero__chip">潜点榜 · 探索</span>
        <span class="ds-hero__chip">AI 助手约潜</span>
      </div>
    </div>

    <p class="ds-hero__note"><i aria-hidden="true"></i>1.2K LIKES · 203 COMMENTS · 15 DIVES</p>

    <!-- 潜点榜（后）与个人主页（前）：设计稿原图，不重绘 -->
    <figure class="ds-shot" style="width:176px;height:381px;right:236px;top:44px;transform:rotate(5deg);opacity:.94">
      <img src="../../assets/images/diveshare-places.png" alt="" />
    </figure>
    <figure class="ds-shot" style="width:208px;height:450px;right:40px;top:12px;transform:rotate(-4deg)">
      <img src="../../assets/images/diveshare-me.png" alt="" />
    </figure>
  </div>
</body>
</html>
