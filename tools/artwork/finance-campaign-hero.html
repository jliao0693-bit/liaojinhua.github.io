<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>金融活动页 · 主视觉 824x474</title>
  <link rel="stylesheet" href="promo.css" />
</head>

<body>
  <div class="pm-hero pm-hero--fin">
    <!-- 三张投放稿：LBANK（后）/ MEXICASH（中）/ moomoo（前） -->
    <div class="pm-shot" style="left: 448px; top: 94px; width: 148px; height: 248px; border-radius: 14px; transform: rotate(-6deg); z-index: 1;">
      <img src="../../assets/images/finance-campaign-lbank.png" alt="" />
    </div>
    <div class="pm-shot" style="left: 604px; top: 154px; width: 118px; height: 204px; border-radius: 12px; transform: rotate(4deg); z-index: 2;">
      <img src="../../assets/images/finance-campaign-mexicash.png" alt="" />
    </div>
    <div class="pm-shot" style="left: 692px; top: 50px; width: 150px; height: 238px; border-radius: 14px; transform: rotate(8deg); z-index: 3;">
      <img src="../../assets/images/finance-campaign-moomoo.png" alt="" />
    </div>

    <div class="pm-hero__copy">
      <span class="pm-hero__eyebrow">CASE STUDY · 金融 / 投资活动页</span>
      <p class="pm-hero__title"><span class="pm-hero__rule"></span>金融活动页</p>
      <p class="pm-hero__en">LBANK · MOOMOO · MEXICASH</p>
      <p class="pm-hero__lead">
        三张稿子分属理财、券商开户与现金贷，<br />
        共用一套骨架：一句利益点 → 三格解释 → 一张表或一个按钮；<br />
        数字只出现在收益、金额与档位三处。
      </p>
      <div class="pm-hero__chips">
        <span class="pm-hero__chip">3 张投放稿</span>
        <span class="pm-hero__chip">英 / 西语</span>
        <span class="pm-hero__chip">黑金 · 琥珀 · 品牌蓝</span>
      </div>
    </div>

    <p class="pm-hero__note">
      <i></i><span>25% APR · S$360 · $50,000</span><b>3 个产品 · 1 套骨架</b>
    </p>
  </div>
</body>

</html>
