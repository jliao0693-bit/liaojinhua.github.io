<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 美食社交 App 824x474</title>
  <link rel="stylesheet" href="foodsocial.css" />
</head>
<body>
  <div class="fs-hero">
    <span class="fs-pastel" aria-hidden="true"></span>
    <span class="fs-blob fs-blob--rose" aria-hidden="true"></span>
    <span class="fs-blob fs-blob--sky" aria-hidden="true"></span>
    <span class="fs-blob fs-blob--gold" aria-hidden="true"></span>
    <span class="fs-dots" aria-hidden="true"></span>

    <div class="fs-hero__copy">
      <span class="fs-hero__eyebrow">FOOD SOCIAL · CASE STUDY</span>
      <p class="fs-hero__title">美食社交</p>
      <p class="fs-hero__en">FOOD SOCIAL APP</p>
      <p class="fs-hero__lead">
        一边看别人今天吃了什么，一边遇到附近同样爱吃的人：<br />
        社区、卡片滑选、金币订阅装进同一个粉色 App。
      </p>
      <div class="fs-hero__chips">
        <span class="fs-hero__chip">社区 Feed</span>
        <span class="fs-hero__chip">卡片滑选</span>
        <span class="fs-hero__chip">金币 · 订阅</span>
      </div>
    </div>

    <p class="fs-hero__note"><i aria-hidden="true"></i>196 COIN · 13 LIKES · 5 BLOCK</p>

    <!-- 他人主页（后）与社区首页（前）：设计稿原图，不重绘 -->
    <figure class="fs-shot" style="width:176px;height:381px;right:238px;top:46px;transform:rotate(5deg);opacity:.95">
      <img src="../../assets/images/foodsocial-other.png" alt="" />
    </figure>
    <figure class="fs-shot" style="width:208px;height:450px;right:40px;top:12px;transform:rotate(-4deg)">
      <img src="../../assets/images/foodsocial-home.png" alt="" />
    </figure>
  </div>
</body>
</html>
