<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 媒资后台 824x474</title>
  <link rel="stylesheet" href="mediaportal.css" />
</head>
<body>
  <div class="mp-hero">
    <span class="mp-hero__grid" aria-hidden="true"></span>

    <div class="mp-hero__copy">
      <span class="mp-hero__eyebrow">MEDIA ASSET PORTAL · CASE STUDY</span>
      <p class="mp-hero__title"><i aria-hidden="true"></i>媒资后台</p>
      <p class="mp-hero__en">WORKBENCH · ASSET LIBRARY</p>
      <p class="mp-hero__lead">
        工作台只回答「今天要做什么」，<br />
        素材管理只回答「这条片子在哪」，<br />
        两屏共用一套蓝，PC 端按 1920×1080 重绘。
      </p>
      <div class="mp-hero__chips">
        <span class="mp-hero__chip">两屏界面</span>
        <span class="mp-hero__chip">品牌蓝 + 浅灰底</span>
        <span class="mp-hero__chip">1920×1080</span>
      </div>
    </div>

    <p class="mp-hero__note"><i aria-hidden="true"></i>待办 22 条 · <b>素材 1,286</b> · 今日发布 83</p>

    <!-- 素材管理（后）与工作台（前）：两屏的渲染图，不重绘 -->
    <figure class="mp-frame" style="left:430px;top:44px;width:340px;height:199px;transform:rotate(-4deg);opacity:.55">
      <div class="mp-frame__bar"><i></i><i></i><i></i></div>
      <img src="../../assets/images/media-assets.png" alt="" />
    </figure>
    <figure class="mp-frame" style="left:366px;top:112px;width:410px;height:239px">
      <div class="mp-frame__bar"><i></i><i></i><i></i></div>
      <img src="../../assets/images/media-dashboard.png" alt="" />
    </figure>
  </div>
</body>
</html>
