<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 摄影社区 App 824x474</title>
  <link rel="stylesheet" href="photoshare.css" />
</head>
<body>
  <div class="ps-hero">
    <span class="ps-paper" aria-hidden="true"></span>
    <span class="ps-dots" aria-hidden="true"></span>
    <span class="ps-blob" style="right:-96px;top:-104px;width:330px;height:330px;background:rgba(216,243,107,.68)" aria-hidden="true"></span>
    <span class="ps-blob" style="right:150px;bottom:-120px;width:260px;height:260px;background:rgba(168,214,240,.34)" aria-hidden="true"></span>
    <span class="ps-blob" style="left:-90px;bottom:-110px;width:240px;height:240px;background:rgba(234,246,221,.85)" aria-hidden="true"></span>

    <div class="ps-hero__copy">
      <span class="ps-hero__eyebrow">PHOTO SHARE · CASE STUDY</span>
      <p class="ps-hero__title">
        <span class="ps-mark" aria-hidden="true"></span>摄影社区
      </p>
      <p class="ps-hero__en">PHOTO COMMUNITY APP</p>
      <p class="ps-hero__lead">
        每天有活动，每张片子有人看：<br />
        一个把「今天拍什么」和「跟谁去拍」放在一起的摄影社区。
      </p>
      <div class="ps-hero__chips">
        <span class="ps-hero__chip">每日活动</span>
        <span class="ps-hero__chip">Quiz Match 找搭子</span>
        <span class="ps-hero__chip">AI 摄影助手</span>
      </div>
    </div>

    <p class="ps-hero__note"><i aria-hidden="true"></i>12 PHOTOS · 128 LIKES · 999 COINS</p>

    <!-- 作品详情（后）与个人主页（前）：设计稿原图，不重绘 -->
    <figure class="ps-shot" style="width:176px;height:381px;right:240px;top:52px;transform:rotate(4deg);opacity:.95">
      <img src="../../assets/images/photoshare-detail.png" alt="" />
    </figure>
    <figure class="ps-shot" style="width:208px;height:450px;right:44px;top:16px;transform:rotate(-4deg)">
      <img src="../../assets/images/photoshare-me.png" alt="" />
    </figure>
  </div>
</body>
</html>
