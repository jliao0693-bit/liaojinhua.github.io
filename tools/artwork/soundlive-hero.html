<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 声浪 · 音乐直播分享 App 824x474</title>
  <link rel="stylesheet" href="soundlive.css" />
</head>
<body>
  <div class="sl-hero">
    <span class="sl-hero__glow sl-hero__glow--a" aria-hidden="true"></span>
    <span class="sl-hero__glow sl-hero__glow--b" aria-hidden="true"></span>
    <span class="sl-hero__glow sl-hero__glow--c" aria-hidden="true"></span>
    <span class="sl-hero__dots" aria-hidden="true"></span>

    <div class="sl-hero__copy">
      <span class="sl-hero__eyebrow">MUSIC LIVE · CASE STUDY</span>
      <p class="sl-hero__title">声浪</p>
      <p class="sl-hero__en">SOUND LIVE</p>
      <p class="sl-hero__lead">
        一个把「听见好歌 → 唱给朋友 → 开一场自己的直播」<br />
        串成一条动线的音乐直播分享 App。
      </p>
      <div class="sl-hero__chips">
        <span class="sl-hero__chip">作品分享</span>
        <span class="sl-hero__chip">实时直播</span>
        <span class="sl-hero__chip">礼物互动</span>
      </div>
    </div>

    <div class="sl-hero__wave" aria-hidden="true">
      <span style="height:8px"></span>
      <span style="height:18px"></span>
      <span style="height:12px"></span>
      <span style="height:24px"></span>
      <span style="height:15px"></span>
      <span style="height:26px"></span>
      <span style="height:10px"></span>
      <span style="height:20px"></span>
      <span style="height:14px"></span>
      <span style="height:23px"></span>
      <span style="height:9px"></span>
      <span style="height:17px"></span>
      <span style="height:11px"></span>
      <span style="height:21px"></span>
    </div>

    <!-- 直播间（前）与热度榜（后）：都是设计稿原图，不重绘 -->
    <figure class="sl-shot" style="width:176px;height:380px;right:224px;top:60px;transform:rotate(5deg);opacity:.94">
      <img src="../../assets/images/soundlive-rank.png" alt="" />
    </figure>
    <figure class="sl-shot" style="width:209px;height:452px;right:40px;top:20px;transform:rotate(-5deg)">
      <img src="../../assets/images/soundlive-room.png" alt="" />
    </figure>
  </div>
</body>
</html>
