<!DOCTYPE html>

<head>

  <title>夏日趣市 · 主视觉 824x474</title>
  <link rel="stylesheet" href="promo.css" />

<body>
  <div class="pm-hero pm-hero--fair">
    <!-- 交付稿整页 -->
    <div class="pm-shot" style="left: 606px; top: 22px; width: 176px; height: 404px; border-radius: 16px; transform: rotate(4deg);">
      <img src="../../assets/images/summer-fair-page.png" alt="" />

    <div class="pm-hero__copy">

      <div class="pm-hero__chips">
        <span class="pm-hero__chip">满减三档</span>
        <span class="pm-hero__chip">单页 H5</span>
        <span class="pm-hero__chip">蓝 / 绿 / 鸭黄</span>

    <p class="pm-hero__note">
      <i></i><span>满 50 · 满 100 · 满 200</span><b>88 / 78 / 68 折</b>
    </p>
