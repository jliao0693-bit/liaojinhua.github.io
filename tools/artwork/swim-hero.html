<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hero / 游泳社交 App 824x474</title>
  <link rel="stylesheet" href="swim.css" />
</head>
<body>
  <div class="sw-hero">
    <span class="sw-pool" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--sky" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--lilac" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--coral" aria-hidden="true"></span>
    <span class="sw-caustic" aria-hidden="true"></span>
    <span class="sw-lane" style="top:392px;width:300px" aria-hidden="true"></span>
    <span class="sw-lane" style="top:406px;width:236px" aria-hidden="true"></span>
    <span class="sw-lane" style="top:420px;width:172px" aria-hidden="true"></span>

    <div class="sw-hero__copy">
      <span class="sw-hero__eyebrow">SWIM SOCIAL · CASE STUDY</span>
      <p class="sw-hero__title">游泳社交</p>
      <p class="sw-hero__en">SWIM SOCIAL APP</p>
      <p class="sw-hero__lead">
        把「想学游泳」和「想找人一起游」放进同一个广场：<br />
        话题负责讨论，动态负责炫技，视频把人拉回池边。
      </p>
      <div class="sw-hero__chips">
        <span class="sw-hero__chip">话题广场</span>
        <span class="sw-hero__chip">发布 · 讨论</span>
        <span class="sw-hero__chip">视频约泳</span>
      </div>
    </div>

    <p class="sw-hero__note"><i aria-hidden="true"></i>1.2K VIEWS · 203 REPLIES · 15 FOLLOWING</p>

    <!-- 话题广场（后）与视频通话（前）：设计稿原图，不重绘 -->
    <figure class="sw-shot" style="width:176px;height:381px;right:238px;top:46px;transform:rotate(5deg);opacity:.95">
      <img src="../../assets/images/swim-home.png" alt="" />
    </figure>
    <figure class="sw-shot" style="width:208px;height:450px;right:40px;top:12px;transform:rotate(-4deg)">
      <img src="../../assets/images/swim-call.png" alt="" />
    </figure>
  </div>
</body>
</html>
