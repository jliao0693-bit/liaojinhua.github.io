<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>cover / 潜水分享 App 292x200</title>
  <link rel="stylesheet" href="diveshare.css" />
</head>
<body>
  <div class="ds-cover">
    <span class="ds-water" aria-hidden="true"></span>
    <span class="ds-ray" style="left:150px;width:54px;transform:rotate(14deg)" aria-hidden="true"></span>
    <span class="ds-ray" style="left:196px;width:30px;transform:rotate(20deg);opacity:.7" aria-hidden="true"></span>
    <span class="ds-caustic" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:150px;top:150px;width:5px;height:5px" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:164px;top:172px;width:3px;height:3px" aria-hidden="true"></span>
    <span class="ds-bubble" style="left:140px;top:182px;width:2px;height:2px" aria-hidden="true"></span>

    <span class="ds-cover__eyebrow">DIVE SHARE</span>
    <p class="ds-cover__cn">潜水分享</p>
    <p class="ds-cover__en">DIVE SHARE APP</p>
    <p class="ds-cover__sub">热门潜点 · 约一次下水</p>
    <span class="ds-cover__spot"><i aria-hidden="true"></i>Indonesia</span>

    <p class="ds-cover__meta">
      <span class="ds-cover__dot" aria-hidden="true"></span>1.2K LIKES · 203
    </p>

    <!-- 潜点榜（后）与首页（前）：设计稿原图，不重绘 -->
    <figure class="ds-shot" style="right:-16px;top:40px;width:82px;height:178px;transform:rotate(9deg);opacity:.5">
      <img src="../../assets/images/diveshare-places.png" alt="" />
    </figure>
    <figure class="ds-shot" style="right:10px;top:16px;width:96px;height:208px;transform:rotate(-6deg)">
      <img src="../../assets/images/diveshare-home.png" alt="" />
    </figure>
  </div>
</body>
</html>
