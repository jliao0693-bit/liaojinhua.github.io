<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>cover / 摄影社区 App 292x200</title>
  <link rel="stylesheet" href="photoshare.css" />
</head>
<body>
  <div class="ps-cover">
    <span class="ps-paper" aria-hidden="true"></span>
    <span class="ps-blob" style="right:-58px;top:-46px;width:150px;height:150px;background:rgba(216,243,107,.72)" aria-hidden="true"></span>
    <span class="ps-blob" style="left:-42px;bottom:-52px;width:120px;height:120px;background:rgba(168,214,240,.46)" aria-hidden="true"></span>

    <span class="ps-cover__eyebrow">PHOTO SHARE</span>
    <div class="ps-cover__title">
      <span class="ps-mark" aria-hidden="true"></span>
      <p class="ps-cover__cn">摄影社区</p>
    </div>
    <p class="ps-cover__en">PHOTO COMMUNITY APP</p>
    <p class="ps-cover__sub">每日活动 · 找搭子 · 器材讨论</p>
    <span class="ps-cover__tag">portrait</span>

    <p class="ps-cover__meta">
      <span class="ps-cover__dot" aria-hidden="true"></span>128 LIKES · 999 COINS
    </p>

    <!-- 探索（后）与首页（前）：设计稿原图，不重绘 -->
    <figure class="ps-shot" style="right:-18px;top:46px;width:82px;height:178px;transform:rotate(8deg);opacity:.55">
      <img src="../../assets/images/photoshare-explore.png" alt="" />
    </figure>
    <figure class="ps-shot" style="right:9px;top:14px;width:96px;height:208px;transform:rotate(-6deg)">
      <img src="../../assets/images/photoshare-home.png" alt="" />
    </figure>
  </div>
</body>
</html>
