<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>work / 声浪 · 音乐直播分享 App 292x200</title>
  <link rel="stylesheet" href="soundlive.css" />
</head>
<body>
  <div class="sl-cover">
    <span class="sl-cover__glow sl-cover__glow--a" aria-hidden="true"></span>
    <span class="sl-cover__glow sl-cover__glow--b" aria-hidden="true"></span>
    <span class="sl-cover__dots" aria-hidden="true"></span>

    <span class="sl-cover__badge">LIVE NOW</span>
    <p class="sl-cover__cn">声浪</p>
    <p class="sl-cover__en">SOUND LIVE</p>
    <p class="sl-cover__sub">音乐直播 · 作品分享</p>
    <p class="sl-cover__meta"><i class="sl-cover__live" aria-hidden="true"></i>12.4K LISTENING</p>

    <!-- 直接使用设计稿原图：热度榜（后）+ 直播间（前） -->
    <figure class="sl-shot" style="width:78px;height:168px;right:84px;top:30px;transform:rotate(7deg);opacity:.92">
      <img src="../../assets/images/soundlive-rank.png" alt="" />
    </figure>
    <figure class="sl-shot" style="width:104px;height:225px;right:8px;top:12px;transform:rotate(-6deg)">
      <img src="../../assets/images/soundlive-room.png" alt="" />
    </figure>

    <span class="sl-wave" aria-hidden="true">
      <span style="height:5px"></span>
      <span style="height:11px"></span>
      <span style="height:8px"></span>
      <span style="height:16px"></span>
      <span style="height:10px"></span>
      <span style="height:18px"></span>
      <span style="height:7px"></span>
      <span style="height:13px"></span>
      <span style="height:6px"></span>
      <span style="height:15px"></span>
      <span style="height:9px"></span>
      <span style="height:17px"></span>
      <span style="height:12px"></span>
      <span style="height:6px"></span>
      <span style="height:14px"></span>
      <span style="height:8px"></span>
    </span>
  </div>
</body>
</html>
