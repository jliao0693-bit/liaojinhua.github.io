<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>work / 游泳社交 App 292x200</title>
  <link rel="stylesheet" href="swim.css" />
</head>
<body>
  <div class="sw-cover">
    <span class="sw-pool" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--sky" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--lilac" aria-hidden="true"></span>
    <span class="sw-blob sw-blob--coral" aria-hidden="true"></span>
    <span class="sw-caustic" aria-hidden="true"></span>
    <span class="sw-lane" style="top:148px;width:120px" aria-hidden="true"></span>
    <span class="sw-lane" style="top:159px;width:96px" aria-hidden="true"></span>
    <span class="sw-lane" style="top:170px;width:72px" aria-hidden="true"></span>

    <span class="sw-cover__eyebrow">SWIM SOCIAL</span>
    <p class="sw-cover__cn">游泳社交</p>
    <p class="sw-cover__en">SWIM SOCIAL APP</p>
    <p class="sw-cover__sub">话题广场 · 约泳</p>

    <span class="sw-cover__topic"><i aria-hidden="true"></i>The benefits of swimming</span>

    <p class="sw-cover__meta"><i class="sw-cover__dot" aria-hidden="true"></i>1.2K VIEWS · 203 REPLIES</p>

    <!-- 直接使用设计稿原图：话题列表（后）+ 话题广场（前） -->
    <figure class="sw-shot" style="width:64px;height:138px;right:84px;top:40px;transform:rotate(6deg);opacity:.94">
      <img src="../../assets/images/swim-topic.png" alt="" />
    </figure>
    <figure class="sw-shot" style="width:82px;height:178px;right:4px;top:6px;transform:rotate(-5deg)">
      <img src="../../assets/images/swim-home.png" alt="" />
    </figure>
  </div>
</body>
</html>
